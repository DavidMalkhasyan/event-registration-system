# EventFlow local demo (NOT for production): the same image as deploy/compose.yaml, served on
# http://localhost:3000 with the fake email provider (mailbox at /dev/mailbox). No domain, HTTPS or Resend.
#   docker compose -f compose.demo.yaml up -d --build
#   docker compose -f compose.demo.yaml run --rm seed          # demo data, once (safe to repeat)
#   docker compose -f compose.demo.yaml run --rm demo-password # sign-in credentials of both demo accounts
#   docker compose -f compose.demo.yaml run --rm admin-totp    # Super Admin second factor, once
# Secrets are generated on first start into the demo-secrets volume (never in Git, never in an image).
# PostgreSQL publishes no port; the web port is bound to 127.0.0.1 only. See docs/QUICKSTART_RU.md.

name: eventflow-demo

x-app: &app
  build:
    context: .
    dockerfile: deploy/Dockerfile
  image: eventflow:demo
  environment: &app-env
    NODE_ENV: development # the fake email provider and /dev/mailbox are refused in production
    HOST: 0.0.0.0
    PORT: '3000'
    PUBLIC_ORIGIN: http://localhost:3000
    EMAIL_PROVIDER: fake
    DEV_MAILBOX_DIR: /data/mailbox
  volumes:
    - demo-secrets:/demo:ro
    - media:/data/media
    - mailbox:/data/mailbox
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '3' }

services:
  # One-shot: writes any missing random secret to the volume (idempotent; keeps existing values).
  secrets-init:
    <<: *app
    user: '0'
    volumes: [demo-secrets:/demo]
    entrypoint: ['sh', '-ec']
    command:
      - |
        node -e "
        const c=require('crypto'),fs=require('fs'),f='/demo/secrets.env',NL=String.fromCharCode(10);
        const have=fs.existsSync(f)?fs.readFileSync(f,'utf8'):'';
        const hex=()=>c.randomBytes(32).toString('hex'),pw=()=>c.randomBytes(15).toString('base64url');
        const gen={POSTGRES_PASSWORD:hex,APP_OWNER_PASSWORD:hex,APP_RUNTIME_PASSWORD:hex,CSRF_SECRET:hex,
          PRESESSION_SECRET:hex,RATE_LIMIT_SECRET:hex,PREVIEW_SECRET:hex,DEMO_ORGANIZER_PASSWORD:pw,
          DEMO_ADMIN_PASSWORD:pw,ADMIN_TOTP_KEY:()=>c.randomBytes(32).toString('base64')};
        const add=Object.entries(gen).filter(([k])=>!have.split(NL).some((l)=>l.startsWith(k+'='))).map(([k,g])=>k+'='+g());
        if(add.length){fs.writeFileSync(f+'.tmp',have.split(NL).filter(Boolean).concat(add).join(NL)+NL);fs.renameSync(f+'.tmp',f);}
        "
        chmod 644 /demo/secrets.env
    restart: 'no'

  postgres:
    image: postgres:18
    entrypoint:
      - sh
      - -ec
      - set -a; . /demo/secrets.env; set +a; exec docker-entrypoint.sh postgres
    volumes:
      - demo-secrets:/demo:ro
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-eventflow.sh:ro
    depends_on:
      secrets-init: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d eventflow']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    shm_size: 256m

  migrate:
    <<: *app
    entrypoint: ['sh', '-ec']
    command:
      - 'set -a; . /demo/secrets.env; set +a; export DATABASE_URL="postgres://app_runtime:$$APP_RUNTIME_PASSWORD@postgres:5432/eventflow" MIGRATION_DATABASE_URL="postgres://app_owner:$$APP_OWNER_PASSWORD@postgres:5432/eventflow"; exec node apps/server/dist/entrypoints/migrate.js'
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  web:
    <<: *app
    environment:
      <<: *app-env
      ADMIN_REQUIRE_TOTP: 'true' # the demo Super Admin signs in with a second factor, as in production
    entrypoint: ['sh', '-ec']
    command:
      - 'set -a; . /demo/secrets.env; set +a; export DATABASE_URL="postgres://app_runtime:$$APP_RUNTIME_PASSWORD@postgres:5432/eventflow" MIGRATION_DATABASE_URL="postgres://app_owner:$$APP_OWNER_PASSWORD@postgres:5432/eventflow"; exec node apps/server/dist/entrypoints/web.js'
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  worker:
    <<: *app
    entrypoint: ['sh', '-ec']
    command:
      - 'set -a; . /demo/secrets.env; set +a; export DATABASE_URL="postgres://app_runtime:$$APP_RUNTIME_PASSWORD@postgres:5432/eventflow" MIGRATION_DATABASE_URL="postgres://app_owner:$$APP_OWNER_PASSWORD@postgres:5432/eventflow"; exec node apps/server/dist/entrypoints/worker.js'
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  # Demo data, only when asked: docker compose -f compose.demo.yaml run --rm seed
  # Idempotent; both demo passwords come from the secrets volume and are never printed by the seed.
  seed:
    <<: *app
    profiles: [tools]
    environment:
      <<: *app-env
      DEMO_SEED_ALLOW_HOST: postgres # the only non-loopback host seed:demo accepts, and only here
    entrypoint: ['sh', '-ec']
    command:
      - 'set -a; . /demo/secrets.env; set +a; export DATABASE_URL="postgres://app_runtime:$$APP_RUNTIME_PASSWORD@postgres:5432/eventflow" MIGRATION_DATABASE_URL="postgres://app_owner:$$APP_OWNER_PASSWORD@postgres:5432/eventflow"; exec node apps/server/dist/entrypoints/seed-demo.js'
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: 'no'

  # Prints the sign-in credentials of both demo accounts: docker compose -f compose.demo.yaml run --rm demo-password
  demo-password:
    <<: *app
    profiles: [tools]
    entrypoint: ['sh', '-ec']
    command:
      - '. /demo/secrets.env; echo "Organizer (http://localhost:3000/organizer)"; echo "Email:    demo.organizer@example.test"; echo "Password: $$DEMO_ORGANIZER_PASSWORD"; echo; echo "Super Admin (http://localhost:3000/admin)"; echo "Email:    demo.admin@example.test"; echo "Password: $$DEMO_ADMIN_PASSWORD"'
    depends_on:
      secrets-init: { condition: service_completed_successfully }
    restart: 'no'
    logging:
      driver: none

  # One-time second factor for the demo Super Admin, with the production command (`admin:totp`): it shows
  # a new secret, you add it to an authenticator app, and type the 6-digit code to confirm. Run after seed.
  #   docker compose -f compose.demo.yaml run --rm admin-totp
  admin-totp:
    <<: *app
    profiles: [tools]
    entrypoint: ['sh', '-ec']
    command:
      - 'set -a; . /demo/secrets.env; set +a; export MIGRATION_DATABASE_URL="postgres://app_owner:$$APP_OWNER_PASSWORD@postgres:5432/eventflow"; exec node apps/server/dist/entrypoints/admin.js totp --email demo.admin@example.test'
    stdin_open: true
    tty: true
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: 'no'

volumes:
  demo-secrets:
  pgdata:
  media:
  mailbox:
