      tags: [live]
      summary: Server-sent events with the live checked-in count.
      description: >-
        Events - "count" with data {"checkedIn": n} (first on connect, then after
        each committed check-in or undo, coalesced up to 250 ms); "access_ended"
        before the server closes the stream. Comment keep-alive every 15 s;
        retry 3000. Authorization is re-validated before every push and at least
        every 30 s; the stream closes at the first failed check. No update is sent
        whose check began after a revocation committed; one update whose check
        completed just before may still be delivered (FR-STAFF-3, AC-186). No Last-Event-ID replay; every connection starts with
        the authoritative count.
      security: [{ orgSession: [] }, { staffSession: [] }]
      x-transaction: TX-X03
      x-requirements: [FR-DSH-2, FR-DSH-3, FR-STAFF-3, NFR-PERF-2, EC-104, AC-25, AC-111, AC-112, AC-186]
      x-principals: [organizer, staff]
      x-staff-accessible: true
      x-idempotency: read-only
      x-confirmation-required: false
      x-sse-events:
        count: { $ref: '#/components/schemas/CheckInCount' }
        access_ended: { $ref: '#/components/schemas/AccessEnded' }
      responses:
        '200':
          description: The event stream.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            text/event-stream:
              schema:
                type: string
                description: 'Lines of the SSE protocol: "event:", "data:" (JSON) and ":" comments.'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ---------------------------------------------------------------- waitlist and undo (owner)
  /api/events/{eventId}/registrations/{registrationId}/waitlist-removal:
    parameters:
      - $ref: '#/components/parameters/eventId'
      - $ref: '#/components/parameters/registrationId'
    post:
      operationId: removeFromWaitlist
      tags: [waitlist]
      summary: Remove a WAITLISTED registration (confirmed; never promotes).
      security: [{ orgSession: [], csrfToken: [] }]
      x-transaction: TX-W01
      x-requirements: [FR-WL-10, FR-WL-11, FR-WL-12, FR-WL-13, FR-WL-14, BR-24, BR-27, AC-76, AC-77, AC-78, AC-79, AC-90, AC-91, AC-92]
      x-principals: [organizer]
      x-idempotency: state
      x-confirmation-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WaitlistRemovalInput' }
      responses:
        '200':
          description: Removed; a removal notice is queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WaitlistRemoved' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/events/{eventId}/check-ins/{checkInId}/undo:
    parameters:
      - $ref: '#/components/parameters/eventId'
      - $ref: '#/components/parameters/checkInId'
    post:
      operationId: undoCheckIn
      tags: [check-in]
      summary: Undo a check-in (owner only; audited).
      security: [{ orgSession: [], csrfToken: [] }]
      x-transaction: TX-C02
      x-requirements: [FR-CHK-8, BR-7, AC-26, AC-27, AC-54]
      x-principals: [organizer]
      x-idempotency: state
      x-confirmation-required: false
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UndoInput' }
      responses:
        '200':
          description: Undone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckInUndone' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ---------------------------------------------------------------- check-in
  /api/events/{eventId}/check-ins:
    parameters:
      - $ref: '#/components/parameters/eventId'
    post:
      operationId: checkIn
      tags: [check-in]
      summary: Check a ticket in (owner or that event's staff; idempotent by requestId).
      description: >-
        Every one of the seven outcomes is a 200 business result. The response
        never contains participant data. A requestId reused by a different
        principal returns 409 request_id_conflict (D-5).
      security: [{ staffSession: [], csrfToken: [] }, { orgSession: [], csrfToken: [] }]
      x-transaction: TX-C01
      x-requirements: [FR-CHK-1, FR-CHK-2, FR-CHK-3, FR-CHK-4, FR-CHK-5, FR-CHK-7, FR-CHK-9, BR-7, AC-22, AC-23, AC-44, AC-109, AC-110, AC-124, AC-156]
      x-principals: [organizer, staff]
      x-staff-accessible: true
      x-idempotency: request-id
      x-confirmation-required: false
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckInInput' }
      responses:
        '200':
          description: The outcome.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckInResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/staff/session:
    get:
      operationId: getStaffSession
      tags: [check-in]
      summary: Current staff session, its event and CSRF token.
      security: [{ staffSession: [] }]
      x-transaction: TX-A08
      x-requirements: [FR-STAFF-2, FR-ORG-4, AC-151]
      x-principals: [staff]
      x-staff-accessible: true
      x-idempotency: read-only
      x-confirmation-required: false
      responses:
        '200':
          description: Staff session information. The session ID is never returned.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffSession' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ---------------------------------------------------------------- staff management (owner)
  /api/events/{eventId}/staff:
    parameters:
      - $ref: '#/components/parameters/eventId'
    get:
      operationId: getStaffOverview
      tags: [staff]
      summary: Invitations and active staff sessions of the event.
      security: [{ orgSession: [] }]
      x-transaction: read
      x-requirements: [FR-STAFF-5, FR-STAFF-6, FR-STAFF-7]
      x-principals: [organizer]
      x-idempotency: read-only
      x-confirmation-required: false
      responses:
        '200':
          description: Staff overview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffOverview' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/events/{eventId}/staff-invitations:
    parameters:
      - $ref: '#/components/parameters/eventId'
    post:
      operationId: inviteStaff
      tags: [staff]
      summary: Invite (or re-invite) a staff member; replaces a pending invitation to the same address.
      security: [{ orgSession: [], csrfToken: [] }]
      x-transaction: TX-S01
      x-requirements: [FR-STAFF-1, FR-STAFF-5, FR-STAFF-6, AC-82, AC-151]
      x-principals: [organizer]
      x-idempotency: none
      x-confirmation-required: false
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffInvitationInput' }
      responses:
        '201':
          description: Invitation created; the email is queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffInvitation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/events/{eventId}/staff-invitations/{invitationId}/revocation:
    parameters:
      - $ref: '#/components/parameters/eventId'
      - $ref: '#/components/parameters/invitationId'
    post:
      operationId: revokeStaffInvitation
      tags: [staff]
      summary: Revoke a pending invitation.
      security: [{ orgSession: [], csrfToken: [] }]
      x-transaction: TX-S03
      x-requirements: [FR-STAFF-3, FR-STAFF-5, AC-82, AC-101]
      x-principals: [organizer]
      x-idempotency: state
      x-confirmation-required: false
      responses:
        '204':
          description: Revoked.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/events/{eventId}/staff-sessions/{staffSessionId}/revocation:
    parameters:
      - $ref: '#/components/parameters/eventId'
      - $ref: '#/components/parameters/staffSessionId'
    post:
      operationId: revokeStaffSession
      tags: [staff]
      summary: Revoke a staff device session (effective on its next request).
      security: [{ orgSession: [], csrfToken: [] }]
      x-transaction: TX-S03
      x-requirements: [FR-STAFF-3, FR-STAFF-6, AC-111, AC-156]
      x-principals: [organizer]
      x-idempotency: state
      x-confirmation-required: false
      responses:
        '204':
          description: Revoked (repeating it also returns 204).
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ---------------------------------------------------------------- system
  /webhooks/email:
    post:
      operationId: receiveProviderWebhook
      tags: [system]
      summary: Signed provider webhook (Svix); acknowledged only after commit.
      security: [{ webhookSignature: [] }]
      x-transaction: TX-M10
      x-requirements: [NFR-REL-6, NFR-REL-10, NFR-REL-15, NFR-REL-18, NFR-REL-13, AC-115, AC-160, AC-165, AC-166, AC-181]
      x-principals: [provider]
      x-idempotency: request-id
      x-confirmation-required: false
      parameters:
        - { name: svix-id, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: svix-timestamp, in: header, required: true, schema: { type: string, pattern: '^[0-9]{1,12}$' } }
      requestBody:
        required: true
        description: Raw provider payload; the signature is verified on the raw bytes before parsing.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderWebhookPayload' }
      responses:
        '204':
          description: Stored (or a redelivery of a stored svix-id).
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /healthz:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness and schema version.
      security: []
      x-transaction: read
      x-requirements: [ENG-CI-6, AC-141]
      x-principals: [anonymous]
      x-idempotency: read-only
      x-confirmation-required: false
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:
  securitySchemes:
    orgSession:
      type: apiKey
      in: cookie
      name: __Host-ers_org
      description: Organizer session cookie (Secure; HttpOnly; SameSite=Lax; Path=/). Never readable by JavaScript (ADR-010).
    staffSession:
      type: apiKey
      in: cookie
      name: __Host-ers_staff
      description: Staff session cookie for one event (same attributes as the organizer cookie).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Session-bound HMAC token from GET /api/auth/session or /api/staff/session; for sign-in confirmation, the pre-session token. Combined with an exact Origin check.
    preSessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ers_presession
      description: Short-lived pre-session nonce cookie for sign-in confirmation (ADR-010 §4).
    linkToken:
      type: http
      scheme: Link
      description: Link token taken from the URL fragment by the page and sent only in "Authorization Link <token>" (FR-LNK-10).
    webhookSignature:
      type: apiKey
      in: header
      name: svix-signature
      description: Svix signature over svix-id, svix-timestamp and the raw body.

  parameters:
    publicId:
      name: publicId
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{22,64}$' }
    eventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    registrationId:
      name: registrationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    checkInId:
      name: checkInId
      in: path
      required: true
      schema: { type: string, format: uuid }
    invitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    staffSessionId:
      name: staffSessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 512, pattern: '^[A-Za-z0-9_-]+$' }
    limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  headers:
    CacheControlNoStore:
      required: true
      schema: { type: string, const: no-store }
    ReferrerPolicy:
      required: true
      schema: { type: string, const: no-referrer }
    RetryAfter:
      required: true
      schema: { type: integer, minimum: 1 }
    CorrelationId:
      required: false
      schema: { type: string, maxLength: 64 }
    SetOrganizerSessionCookie:
      required: true
      description: '__Host-ers_org=<session id>; Secure; HttpOnly; SameSite=Lax; Path=/; Max-Age=<seconds to absolute expiry>. Also clears __Host-ers_presession.'
      schema: { type: string }
    ClearOrganizerSessionCookie:
      required: true
      description: '__Host-ers_org=; Secure; HttpOnly; SameSite=Lax; Path=/; Max-Age=0'
      schema: { type: string }
    SetStaffSessionCookie:
      required: true
      description: '__Host-ers_staff=<session id>; Secure; HttpOnly; SameSite=Lax; Path=/; Max-Age=<seconds to the earlier of absolute expiry and check-in window end>'
      schema: { type: string }
    SetPreSessionCookie:
      required: true
      description: '__Host-ers_presession=<nonce>; Secure; HttpOnly; SameSite=Strict; Path=/; Max-Age=900'
      schema: { type: string }

  responses:
    BadRequest:
      description: Malformed JSON, unknown fields or wrong content type.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: Field validation failed (errors list).
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: No valid session (code unauthenticated), or recent authentication required (code reauthentication_required).
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Principal not allowed (forbidden), CSRF token invalid (csrf_failed) or Origin mismatch (origin_check_failed).
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found, or not the caller's resource (existence is not revealed).
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: State or invariant conflict with a stable code and only safe details.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: Unexpected error; only a correlation ID.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: Infrastructure unavailable (database, timeouts).
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    GenericInvalidLink:
      description: >-
        The generic invalid-link response (FR-LNK-7). Byte-identical body and
        status for every unusable token of every link type. No correlation ID.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
        Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GenericInvalidLink' }
    GenericInvalidLinkRateLimited:
      description: Failed-lookup limit reached (FR-LNK-7); same body as the generic 404.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
        Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GenericInvalidLink' }
    LinkRateLimitedOrInvalid:
      description: >-
        Either the generic failed-lookup 429 (same body as the generic 404), or,
        for a valid token, an action limit (resend_limit, rotation_limit) as
        Problem Details.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
        Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GenericInvalidLink' }
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    LinkBadRequest:
      description: Malformed body sent with a valid token (tokens are checked before bodies).
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
        Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    LinkValidationFailed:
      description: Field validation failed with a valid token (for example confirmed missing).
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
        Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    LinkForbidden:
      description: Origin mismatch on a link action (origin_check_failed), or pre-session token invalid (csrf_failed, sign-in only).
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
        Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    LinkConflict:
      description: Business conflict for a valid token (for example cancellation_closed, request_already_processed).
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
        Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    LinkInternalError:
      description: >-
        Unexpected failure on a link route (API-D1). Safe body - code and
        correlation ID only, identical for every link type and token.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
        Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SafeServerProblem' }
    LinkServiceUnavailable:
      description: Infrastructure failure on a link route (API-D1). Safe body, identical for every link type and token.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
        Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SafeServerProblem' }
    LinkHeadOk:
      description: Same status and headers as the GET, no body.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
        Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
    LinkHeadInvalid:
      description: Same status and headers as the generic 404, no body.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
        Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
    LinkHeadRateLimited:
      description: Same status and headers as the generic 429, no body.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
        Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
    LinkHeadError:
      description: Same status and headers as the GET 500, no body.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
        Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
    LinkHeadUnavailable:
      description: Same status and headers as the GET 503, no body.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
        Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }

  schemas:
    # ---------- primitives
    Uuid: { type: string, format: uuid }
    Instant: { type: string, format: date-time, description: RFC 3339 instant in UTC. }
    LocalDateTime: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}$', description: Local wall-clock time in the event's time zone. }
    UtcOffset: { type: string, pattern: '^[+-][0-9]{2}:[0-9]{2}$' }
    TimeZone: { type: string, minLength: 1, maxLength: 64, description: "IANA time-zone name, validated against the application's tz database." }
    Email: { type: string, format: email, minLength: 3, maxLength: 254 }
    MaskedEmail: { type: string, maxLength: 254, description: 'For example "j***@e***.com".' }
    RequestId: { type: string, format: uuid, description: Client-generated with crypto.randomUUID(). }
    IssuedLinkUrl:
      type: string
      format: uri
      pattern: '#t=[A-Za-z0-9_-]{43}$'
      description: Full link URL on our origin with the raw token in the fragment (ADR-011). Shown once; never stored by the client.
    TicketCode: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{12}$' }
    TransferStatement: { type: string, const: 'This ticket can be transferred, but it admits one person, once.' }
    ConfirmedTrue: { type: boolean, const: true, description: 'Explicit confirmation step (FR-LNK-9, API-D4).' }
    Reason: { type: string, minLength: 1, maxLength: 500 }
    Cursor: { type: [string, 'null'], maxLength: 512 }

    # ---------- enums
    EventStatus: { type: string, enum: [SCHEDULED, CANCELLED] }
    EventPhase: { type: string, enum: [registration_open, registration_closed, started, cancelled] }
    RegistrationState: { type: string, enum: [PENDING_VERIFICATION, CONFIRMED, WAITLISTED, CANCELLED, EXPIRED] }
    CheckInOutcome: { type: string, enum: [CHECKED_IN, ALREADY_CHECKED_IN, INVALID_CODE, WRONG_EVENT, TICKET_CANCELLED, EVENT_CANCELLED, OUTSIDE_CHECK_IN_WINDOW] }
    MessageType:
      type: string
      enum: [verification, existing_access, ticket_resend, management_link_replaced, staff_invitation, sign_in, email_change_confirmation, ticket_confirmation, promotion, event_change, event_cancellation, registration_cancelled, waitlist_removed, email_change_notice, waitlist_confirmation, reminder, waitlist_closed]
    SendState: { type: string, enum: [ACCEPTED, FAILED, UNCONFIRMED, DROPPED] }
    DeliveryLabel:
      type: string
      description: Owner-facing labels (NFR-REL-11). "accepted_not_confirmed" is never shown as delivered.
      enum: [accepted_not_confirmed, delivered, delivered_later_bounced, bounced, failed, delivery_outcome_unknown, delivery_outcome_unknown_superseded, delayed_by_provider, recorded_not_sent_provider_reported]
    ProviderOutcome: { type: string, enum: [delivered, delivered_later_bounced, bounced, failed, suppressed, complained] }
    DeletionBlocker: { type: string, enum: [event_cancelled, has_confirmed_registrations, has_waitlisted_registrations, notifications_pending] }
    ProblemCode:
      type: string
      enum: [bad_request, validation_failed, unauthenticated, reauthentication_required, csrf_failed, origin_check_failed, forbidden, not_found, registration_closed, event_not_scheduled, event_started, capacity_below_confirmed, schedule_version_mismatch, nonexistent_local_time, ambiguous_local_time, start_not_in_future, cancelled_event_not_deletable, deletion_blocked, notifications_pending, preview_invalid, request_id_reused, cancellation_closed, ticket_checked_in, not_confirmed, request_already_processed, rotation_not_available, rotation_not_applied, not_waitlisted, check_in_already_undone, request_id_conflict, check_in_window_ended, invitation_not_pending, email_change_not_possible, rate_limited, resend_limit, rotation_limit, check_in_failures, invalid_signature, internal_error, service_unavailable]

    # ---------- errors
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field: { type: string, maxLength: 100 }
        code: { type: string, maxLength: 64 }
    Problem:
      type: object
      description: RFC 9457 Problem Details with a stable code (ADR-017). Never contains stack traces, SQL, constraint names, tokens, hashes or other people's data.
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string, maxLength: 200 }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { $ref: '#/components/schemas/ProblemCode' }
        detail: { type: string, maxLength: 500 }
        correlationId: { type: string, maxLength: 64 }
        errors: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/FieldError' } }
        minimumCapacity: { type: integer, minimum: 1 }
        reasons: { type: array, items: { $ref: '#/components/schemas/DeletionBlocker' } }
        offsets: { type: array, maxItems: 2, items: { $ref: '#/components/schemas/UtcOffset' } }
        currentScheduleVersion: { type: integer, minimum: 1 }
        firstCheckedInAt: { $ref: '#/components/schemas/Instant' }
    SafeServerProblem:
      type: object
      description: The only body allowed for 500 and 503 on link routes (API-D1).
      additionalProperties: false
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, const: 'about:blank' }
        title: { type: string, enum: [Internal error, Service unavailable] }
        status: { type: integer, enum: [500, 503] }
        code: { type: string, enum: [internal_error, service_unavailable] }
        correlationId: { type: string, maxLength: 64 }
    GenericInvalidLink:
      type: object
      description: Exact fixed body (FR-LNK-7, BR-30). Serialized with this property order and no whitespace.
      additionalProperties: false
      required: [code, message, hint]
      properties:
        code: { type: string, const: invalid_link }
        message: { type: string, const: 'This link is not valid or has expired.' }
        hint: { type: string, const: 'If you were trying to register, please start again from the event page.' }

    # ---------- shared views
    EventSummaryPublic:
      type: object
      additionalProperties: false
      required: [title, startsAt, timeZone]
      properties:
        title: { type: string, maxLength: 200 }
        startsAt: { $ref: '#/components/schemas/Instant' }
        timeZone: { $ref: '#/components/schemas/TimeZone' }
    PublicEvent:
      type: object
      additionalProperties: false
      required: [title, description, startsAt, timeZone, phase]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 5000 }
        startsAt: { $ref: '#/components/schemas/Instant' }
        timeZone: { $ref: '#/components/schemas/TimeZone' }
        phase: { $ref: '#/components/schemas/EventPhase' }
    CheckYourEmail:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: check_your_email }
    Redirect:
      type: object
      additionalProperties: false
      required: [redirect]
      properties:
        redirect: { type: string, enum: [/organizer/, /staff/] }
    ConfirmedAction:
      type: object
      additionalProperties: false
      required: [confirmed]
      properties:
        confirmed: { $ref: '#/components/schemas/ConfirmedTrue' }

    # ---------- public registration
    RegistrationSubmission:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { $ref: '#/components/schemas/Email' }

    # ---------- verification
    VerificationView:
      type: object
      additionalProperties: false
      required: [state, event]
      properties:
        state: { type: string, enum: [awaiting_confirmation, already_confirmed] }
        event: { $ref: '#/components/schemas/EventSummaryPublic' }
    VerificationResult:
      oneOf:
        - $ref: '#/components/schemas/VerificationConfirmed'
        - $ref: '#/components/schemas/VerificationWaitlisted'
        - $ref: '#/components/schemas/VerificationAlreadyConfirmed'
      discriminator:
        propertyName: result
        mapping:
          confirmed: '#/components/schemas/VerificationConfirmed'
          waitlisted: '#/components/schemas/VerificationWaitlisted'
          already_confirmed: '#/components/schemas/VerificationAlreadyConfirmed'
    VerificationConfirmed:
      type: object
      additionalProperties: false
      required: [result, event, ticket, links, transferStatement]
      properties:
        result: { type: string, const: confirmed }
        event: { $ref: '#/components/schemas/EventSummaryPublic' }
        ticket: { $ref: '#/components/schemas/TicketView' }
        links:
          type: object
          additionalProperties: false
          required: [management, share]
          properties:
            management: { $ref: '#/components/schemas/IssuedLinkUrl' }
            share: { $ref: '#/components/schemas/IssuedLinkUrl' }
        transferStatement: { $ref: '#/components/schemas/TransferStatement' }
    VerificationWaitlisted:
      type: object
      additionalProperties: false
      required: [result, event, position, positionMayChange, links]
      properties:
        result: { type: string, const: waitlisted }
        event: { $ref: '#/components/schemas/EventSummaryPublic' }
        position: { type: integer, minimum: 1 }
        positionMayChange: { type: boolean, const: true }
        links:
          type: object
          additionalProperties: false
          required: [management]
          properties:
            management: { $ref: '#/components/schemas/IssuedLinkUrl' }
    VerificationAlreadyConfirmed:
      type: object
      additionalProperties: false
      required: [result]
      properties:
        result: { type: string, const: already_confirmed }
    TicketView:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { $ref: '#/components/schemas/TicketCode' }

    # ---------- management
    ManagementView:
      type: object
      additionalProperties: false
      required: [state, event, actions]
      properties:
        state: { type: string, enum: [CONFIRMED, WAITLISTED] }
        event: { $ref: '#/components/schemas/EventSummaryPublic' }
        ticket: { $ref: '#/components/schemas/TicketView' }
        checkedIn: { type: boolean, description: Present for CONFIRMED. }
        position: { type: integer, minimum: 1, description: Present for WAITLISTED; computed at request time. }
        transferStatement: { $ref: '#/components/schemas/TransferStatement' }
        actions:
          type: object
          additionalProperties: false
          required: [cancel, resend, issueShareLink, rotateManagement, rotateShare]
          properties:
            cancel: { type: boolean }
            resend: { type: boolean }
            issueShareLink: { type: boolean }
            rotateManagement: { type: boolean }
            rotateShare: { type: boolean }
    RegistrationCancelled:
      type: object
      additionalProperties: false
      required: [result, previousState]
      properties:
        result: { type: string, const: cancelled }
        previousState: { type: string, enum: [CONFIRMED, WAITLISTED] }
    ResendRequest:
      type: object
      additionalProperties: false
      required: [requestId]
      properties:
        requestId: { $ref: '#/components/schemas/RequestId' }
    ResendQueued:
      type: object
      additionalProperties: false
      required: [result]
      properties:
        result: { type: string, const: queued }
    ShareLinkIssued:
      type: object
      additionalProperties: false
      required: [shareLink]
      properties:
        shareLink: { $ref: '#/components/schemas/IssuedLinkUrl' }
    RotationRequest:
      type: object
      additionalProperties: false
      required: [linkType, requestId, confirmed]
      properties:
        linkType: { type: string, enum: [management, share] }
        requestId: { $ref: '#/components/schemas/RequestId' }
        confirmed: { $ref: '#/components/schemas/ConfirmedTrue' }
    RotationResult:
      oneOf:
        - $ref: '#/components/schemas/RotationRotated'
        - $ref: '#/components/schemas/RotationAlreadyReplaced'
      discriminator:
        propertyName: result
        mapping:
          rotated: '#/components/schemas/RotationRotated'
          already_replaced: '#/components/schemas/RotationAlreadyReplaced'
    RotationRotated:
      type: object
      additionalProperties: false
      required: [result, linkType, newLink, replacementEmailQueued]
      properties:
        result: { type: string, const: rotated }
        linkType: { type: string, enum: [management, share] }
        newLink: { $ref: '#/components/schemas/IssuedLinkUrl' }
        replacementEmailQueued: { type: boolean, description: True for management rotations (FR-ROT-5). }
    RotationAlreadyReplaced:
      type: object
      additionalProperties: false
      required: [result]
      properties:
        result: { type: string, const: already_replaced }

    # ---------- share view
    ShareView:
      oneOf:
        - $ref: '#/components/schemas/ShareViewValid'
        - $ref: '#/components/schemas/ShareViewCheckedIn'
        - $ref: '#/components/schemas/ShareViewNotAvailable'
      discriminator:
        propertyName: state
        mapping:
          valid: '#/components/schemas/ShareViewValid'
          checked_in: '#/components/schemas/ShareViewCheckedIn'
          not_available: '#/components/schemas/ShareViewNotAvailable'
    ShareViewValid:
      type: object
      additionalProperties: false
      required: [state, event, ticket, transferStatement]
      properties:
        state: { type: string, const: valid }
        event: { $ref: '#/components/schemas/EventSummaryPublic' }
        ticket: { $ref: '#/components/schemas/TicketView' }
        transferStatement: { $ref: '#/components/schemas/TransferStatement' }
    ShareViewCheckedIn:
      type: object
      additionalProperties: false
      required: [state, event, transferStatement]
      properties:
        state: { type: string, const: checked_in }
        event: { $ref: '#/components/schemas/EventSummaryPublic' }
        transferStatement: { $ref: '#/components/schemas/TransferStatement' }
    ShareViewNotAvailable:
      type: object
      additionalProperties: false
      required: [state, event]
      properties:
        state: { type: string, const: not_available }
        event: { $ref: '#/components/schemas/EventSummaryPublic' }

    # ---------- staff invitation, sign-in, email change links
    InvitationView:
      type: object
      additionalProperties: false
      required: [event]
      properties:
        event: { $ref: '#/components/schemas/EventSummaryPublic' }
    SignInLinkView:
      type: object
      additionalProperties: false
      required: [maskedEmail, purpose, preSessionToken]
      properties:
        maskedEmail: { $ref: '#/components/schemas/MaskedEmail' }
        purpose: { type: string, enum: [sign_in, reauth] }
        preSessionToken:
          type: string
          pattern: '^v1\.[0-9]{1,5}\.[0-9]{10}\.[A-Za-z0-9_-]{43}$'
          description: 'v1.<keyId>.<expiry epoch seconds>.<HMAC> bound to the pre-session cookie nonce and this sign-in request (ADR-010 §4). Sent back in X-CSRF-Token.'
    EmailChangeLinkView:
      type: object
      additionalProperties: false
      required: [maskedNewEmail]
      properties:
        maskedNewEmail: { $ref: '#/components/schemas/MaskedEmail' }
    EmailChanged:
      type: object
      additionalProperties: false
      required: [result]
      properties:
        result: { type: string, const: email_changed }

    # ---------- auth and account
    SignInRequestInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { $ref: '#/components/schemas/Email' }
    OrganizerSession:
      type: object
      additionalProperties: false
      required: [accountId, email, authenticatedAt, recentAuthUntil, csrfToken]
      properties:
        accountId: { $ref: '#/components/schemas/Uuid' }
        email: { $ref: '#/components/schemas/Email' }
        authenticatedAt: { $ref: '#/components/schemas/Instant' }
        recentAuthUntil: { $ref: '#/components/schemas/Instant' }
        csrfToken: { $ref: '#/components/schemas/CsrfToken' }
    CsrfToken:
      type: string
      pattern: '^v1\.[0-9]{1,5}\.[A-Za-z0-9_-]{43}$'
      description: 'v1.<keyId>.<HMAC-SHA-256 of the session> (ADR-010 §3). Kept in page memory only.'
    Account:
      type: object
      additionalProperties: false
      required: [accountId, email]
      properties:
        accountId: { $ref: '#/components/schemas/Uuid' }
        email: { $ref: '#/components/schemas/Email' }
    EmailChangeRequestInput:
      type: object
      additionalProperties: false
      required: [newEmail]
      properties:
        newEmail: { $ref: '#/components/schemas/Email' }

    # ---------- events
    EventCreateInput:
      type: object
      additionalProperties: false
      required: [requestId, title, localStart, timeZone, capacity]
      properties:
        requestId: { $ref: '#/components/schemas/RequestId' }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 5000 }
        localStart: { $ref: '#/components/schemas/LocalDateTime' }
        timeZone: { $ref: '#/components/schemas/TimeZone' }
        utcOffset: { $ref: '#/components/schemas/UtcOffset' }
        capacity: { type: integer, minimum: 1, description: Upper bound under OQ-9. }
    Event:
      type: object
      additionalProperties: false
      required: [id, publicId, publicUrl, title, description, startsAt, timeZone, capacity, confirmedCount, status, phase, scheduleVersion, cutoffAt, checkInOpensAt, checkInClosesAt, createdAt, cancelledAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        publicId: { type: string, pattern: '^[A-Za-z0-9_-]{22,64}$' }
        publicUrl: { type: string, format: uri }
        title: { type: string, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 5000 }
        startsAt: { $ref: '#/components/schemas/Instant' }
        timeZone: { $ref: '#/components/schemas/TimeZone' }
        capacity: { type: integer, minimum: 1 }
        confirmedCount: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/EventStatus' }
        phase: { $ref: '#/components/schemas/EventPhase' }
        scheduleVersion: { type: integer, minimum: 1 }
        cutoffAt: { $ref: '#/components/schemas/Instant' }
        checkInOpensAt: { $ref: '#/components/schemas/Instant' }
        checkInClosesAt: { $ref: '#/components/schemas/Instant' }
        createdAt: { $ref: '#/components/schemas/Instant' }
        cancelledAt: { oneOf: [{ $ref: '#/components/schemas/Instant' }, { type: 'null' }] }
    EventCreated:
      type: object
      additionalProperties: false
      required: [event, warnings]
      properties:
        event: { $ref: '#/components/schemas/Event' }
        warnings:
          type: array
          items: { type: string, enum: [registration_closed_immediately] }
    EventPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Event' } }
        nextCursor: { $ref: '#/components/schemas/Cursor' }
    EventDetailsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 5000 }
    CapacityInput:
      type: object
      additionalProperties: false
      required: [capacity]
      properties:
        capacity: { type: integer, minimum: 1 }
    RescheduleInput:
      type: object
      additionalProperties: false
      required: [localStart, expectedScheduleVersion]
      description: The event's time zone is preserved (API-D5); there is no timeZone field.
      properties:
        localStart: { $ref: '#/components/schemas/LocalDateTime' }
        utcOffset: { $ref: '#/components/schemas/UtcOffset' }
        expectedScheduleVersion: { type: integer, minimum: 1 }
    DeletionPreview:
      type: object
      additionalProperties: false
      required: [eligible, blockers, requiredNoticeIssues, previewToken, previewExpiresAt]
      properties:
        eligible: { type: boolean }
        blockers: { type: array, items: { $ref: '#/components/schemas/DeletionBlocker' } }
        requiredNoticeIssues: { type: array, items: { $ref: '#/components/schemas/NoticeIssue' } }
        previewToken: { $ref: '#/components/schemas/PreviewToken' }
        previewExpiresAt: { $ref: '#/components/schemas/Instant' }
    PreviewToken:
      type: string
      pattern: '^v1\.[0-9]{1,5}\.[0-9]{10}\.[A-Za-z0-9_-]{43}$'
      description: 'v1.<keyId>.<expiry>.<HMAC over account, event, schedule version and the eligibility snapshot> (API_DESIGN §7.4).'
    NoticeIssue:
      type: object
      additionalProperties: false
      required: [registrationId, messageType, sendState, label]
      properties:
        registrationId: { $ref: '#/components/schemas/Uuid' }
        messageType: { type: string, enum: [registration_cancelled, waitlist_removed] }
        sendState: { $ref: '#/components/schemas/SendState' }
        label: { $ref: '#/components/schemas/DeliveryLabel' }
        reason: { type: string, maxLength: 300 }
    DeleteEventInput:
      type: object
      additionalProperties: false
      required: [confirmed, previewToken]
      properties:
        confirmed: { $ref: '#/components/schemas/ConfirmedTrue' }
        previewToken: { $ref: '#/components/schemas/PreviewToken' }

    # ---------- participants (owner only)
    Dashboard:
      type: object
      additionalProperties: false
      required: [phase, counts, emailIssueCount]
      properties:
        phase: { $ref: '#/components/schemas/EventPhase' }
        counts:
          type: object
          additionalProperties: false
          required: [confirmed, waitlisted, checkedIn]
          properties:
            confirmed: { type: integer, minimum: 0 }
            waitlisted: { type: integer, minimum: 0 }
            checkedIn: { type: integer, minimum: 0 }
        emailIssueCount: { type: integer, minimum: 0 }
    ParticipantPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Participant' } }
        nextCursor: { $ref: '#/components/schemas/Cursor' }
    Participant:
      type: object
      additionalProperties: false
      required: [registrationId, email, state, emailIssues]
      properties:
        registrationId: { $ref: '#/components/schemas/Uuid' }
        email: { $ref: '#/components/schemas/Email' }
        state: { $ref: '#/components/schemas/RegistrationState' }
        position: { type: integer, minimum: 1 }
        checkedInAt: { $ref: '#/components/schemas/Instant' }
        checkInId: { $ref: '#/components/schemas/Uuid' }
        emailIssues: { type: array, items: { $ref: '#/components/schemas/EmailIssue' } }
    EmailIssue:
      type: object
      additionalProperties: false
      required: [messageType, sendState, label, at, anomaly]
      properties:
        messageType: { $ref: '#/components/schemas/MessageType' }
        sendState: { $ref: '#/components/schemas/SendState' }
        label: { $ref: '#/components/schemas/DeliveryLabel' }
        providerOutcome: { $ref: '#/components/schemas/ProviderOutcome' }
        reason: { type: string, maxLength: 300 }
        at: { $ref: '#/components/schemas/Instant' }
        anomaly: { type: boolean, description: True when provider evidence contradicts a DROPPED or FAILED state (NFR-REL-13 g). }

    # ---------- waitlist and check-in
    WaitlistRemovalInput:
      type: object
      additionalProperties: false
      required: [confirmed]
      properties:
        confirmed: { $ref: '#/components/schemas/ConfirmedTrue' }
        reason: { $ref: '#/components/schemas/Reason' }
    WaitlistRemoved:
      type: object
      additionalProperties: false
      required: [result]
      properties:
        result: { type: string, const: removed }
    UndoInput:
      type: object
      additionalProperties: false
      properties:
        reason: { $ref: '#/components/schemas/Reason' }
    CheckInUndone:
      type: object
      additionalProperties: false
      required: [result]
      properties:
        result: { type: string, const: undone }
    CheckInInput:
      type: object
      additionalProperties: false
      required: [code, requestId]
      properties:
        code: { type: string, minLength: 1, maxLength: 32, description: 'Normalized server-side (upper case, Crockford look-alikes) before lookup.' }
        requestId: { $ref: '#/components/schemas/RequestId' }
    CheckInResult:
      type: object
      description: Outcome only - never participant identity, email or ticket lists (FR-CHK-4, FR-CHK-7).
      additionalProperties: false
      required: [outcome]
      properties:
        outcome: { $ref: '#/components/schemas/CheckInOutcome' }
        firstCheckedInAt: { $ref: '#/components/schemas/Instant' }
    CheckInCount:
      type: object
      additionalProperties: false
      required: [checkedIn]
      properties:
        checkedIn: { type: integer, minimum: 0 }
    AccessEnded:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, enum: [revoked, expired, event_cancelled, window_ended] }
    StaffSession:
      type: object
      additionalProperties: false
      required: [eventId, event, windowOpensAt, windowClosesAt, csrfToken]
      properties:
        eventId: { $ref: '#/components/schemas/Uuid' }
        event: { $ref: '#/components/schemas/EventSummaryPublic' }
        windowOpensAt: { $ref: '#/components/schemas/Instant' }
        windowClosesAt: { $ref: '#/components/schemas/Instant' }
        csrfToken: { $ref: '#/components/schemas/CsrfToken' }

    # ---------- staff management (owner only)
    StaffInvitationInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { $ref: '#/components/schemas/Email' }
    StaffInvitation:
      type: object
      additionalProperties: false
      required: [id, email, status, createdAt, expiresAt, canReinvite]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { $ref: '#/components/schemas/Email' }
        status: { type: string, enum: [pending, accepted, expired, revoked, replaced] }
        createdAt: { $ref: '#/components/schemas/Instant' }
        expiresAt: { $ref: '#/components/schemas/Instant' }
        acceptedAt: { $ref: '#/components/schemas/Instant' }
        canReinvite: { type: boolean }
    StaffSessionSummary:
      type: object
      additionalProperties: false
      required: [id, createdAt, lastSeenAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        createdAt: { $ref: '#/components/schemas/Instant' }
        lastSeenAt: { $ref: '#/components/schemas/Instant' }
    StaffOverview:
      type: object
      additionalProperties: false
      required: [invitations, sessions]
      properties:
        invitations: { type: array, items: { $ref: '#/components/schemas/StaffInvitation' } }
        sessions: { type: array, items: { $ref: '#/components/schemas/StaffSessionSummary' } }

    # ---------- system
    ProviderWebhookPayload:
      type: object
      description: Provider event as sent by Resend (opaque to the contract; validated after the signature check).
      required: [type]
      properties:
        type: { type: string, maxLength: 64 }
        created_at: { type: string }
        data: { type: object }
    Health:
      type: object
      additionalProperties: false
      required: [schemaVersion, database]
      properties:
        schemaVersion: { type: integer, minimum: 1 }
        database: { type: string, const: ok }
