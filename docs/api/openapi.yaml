openapi: 3.1.0
info:
  title: Event Registration System API
  version: 0.1.1-design
  summary: Reviewed API contract for the MVP (design baseline; no implementation yet).
  description: >-
    Contract for the same-origin JSON API of the Event Registration System.
    Narrative, decisions and traceability are in docs/api/API_DESIGN.md.
    Requirements baseline: REQUIREMENTS.md v1.7. Every operation carries
    x-transaction (TRANSACTIONS_AND_LOCKING.md), x-requirements, x-principals,
    x-idempotency and x-confirmation-required. The generic invalid-link
    response (FR-LNK-7) is byte-identical for every unusable link token.
servers:
  - url: /
    description: The single public origin (ADR-013). No version prefix (API-D8).
security: []
tags:
  - name: public
    description: Public event page and registration.
  - name: links
    description: Link-resolution API and link actions. Token only in "Authorization Link"; cookies ignored (FR-LNK-10).
  - name: auth
    description: Organizer sign-in requests and session management.
  - name: account
    description: Organizer account and email change.
  - name: events
    description: Event management by the owner.
  - name: participants
    description: Read-only dashboard and participant list (ADR-021).
  - name: waitlist
    description: Waiting-list removal by the owner.
  - name: check-in
    description: Check-in, undo and staff session.
  - name: staff
    description: Staff invitations and staff sessions, managed by the owner.
  - name: live
    description: Server-sent events for the live checked-in count.
  - name: system
    description: Provider webhooks and health.

paths:
  # ---------------------------------------------------------------- public
  /api/public/events/{publicId}:
    parameters:
      - $ref: '#/components/parameters/publicId'
    get:
      operationId: getPublicEvent
      tags: [public]
      summary: Public event page data.
      security: []
      x-transaction: read
      x-requirements: [FR-EVT-12, FR-DSH-5, AC-123]
      x-principals: [anonymous]
      x-idempotency: read-only
      x-confirmation-required: false
      responses:
        '200':
          description: Public event information.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicEvent' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/public/events/{publicId}/registrations:
    parameters:
      - $ref: '#/components/parameters/publicId'
    post:
      operationId: submitRegistration
      tags: [public]
      summary: Submit or resubmit a registration (always the same response).
      description: >-
        Creates a PENDING_VERIFICATION registration, resubmits a pending one, or
        sends an existing-registration access email. The 202 body and status are
        identical in all three cases (NFR-SEC-2). Origin is checked.
      security: []
      x-transaction: TX-R01
      x-requirements: [FR-REG-1, FR-REG-2, FR-REG-7, FR-REG-8, FR-REG-10, NFR-SEC-2, NFR-SEC-3, AC-5, AC-37]
      x-principals: [anonymous]
      x-idempotency: none
      x-confirmation-required: false
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationSubmission' }
      responses:
        '202':
          description: Always "check your email".
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckYourEmail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ---------------------------------------------------------------- links: verification
  /api/links/verify:
    get:
      operationId: resolveVerificationLink
      tags: [links]
      summary: Resolve a verification link (read-only).
      security: [{ linkToken: [] }]
      x-transaction: TX-X02
      x-requirements: [FR-REG-4, FR-REG-11, FR-REG-12, FR-LNK-7, FR-LNK-9, FR-LNK-10, AC-60, AC-93, AC-94]
      x-principals: [link:verification]
      x-idempotency: read-only
      x-confirmation-required: false
      responses:
        '200':
          description: Confirmation page data, or "already confirmed".
          headers: { Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }, Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationView' }
        '404': { $ref: '#/components/responses/GenericInvalidLink' }
        '429': { $ref: '#/components/responses/GenericInvalidLinkRateLimited' }
        '500': { $ref: '#/components/responses/LinkInternalError' }
        '503': { $ref: '#/components/responses/LinkServiceUnavailable' }
    head:
      operationId: headVerificationLink
      tags: [links]
      summary: HEAD of the verification link resolution (same status and headers as GET, no body, no state change).
      security: [{ linkToken: [] }]
      x-transaction: TX-X02
      x-requirements: [FR-LNK-9, AC-60, AC-94]
      x-principals: [link:verification]
      x-idempotency: read-only
      x-confirmation-required: false
      responses:
        '200': { $ref: '#/components/responses/LinkHeadOk' }
        '404': { $ref: '#/components/responses/LinkHeadInvalid' }
        '429': { $ref: '#/components/responses/LinkHeadRateLimited' }
        '500': { $ref: '#/components/responses/LinkHeadError' }
        '503': { $ref: '#/components/responses/LinkHeadUnavailable' }

  /api/links/verify/confirm:
    post:
      operationId: confirmVerification
      tags: [links]
      summary: Confirm a registration (explicit action).
      security: [{ linkToken: [] }]
      x-transaction: TX-R02
      x-requirements: [FR-REG-4, FR-REG-5, FR-REG-11, FR-REG-12, FR-LNK-2, FR-NTF-2, BR-9, AC-2, AC-3, AC-4, AC-81, AC-88, AC-182]
      x-principals: [link:verification]
      x-idempotency: state
      x-confirmation-required: false
      responses:
        '200':
          description: Confirmed, waitlisted, or already confirmed. Raw tokens appear only inside the issued link URLs.
          headers: { Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }, Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationResult' }
        '403': { $ref: '#/components/responses/LinkForbidden' }
        '404': { $ref: '#/components/responses/GenericInvalidLink' }
        '429': { $ref: '#/components/responses/GenericInvalidLinkRateLimited' }
        '500': { $ref: '#/components/responses/LinkInternalError' }
        '503': { $ref: '#/components/responses/LinkServiceUnavailable' }

  # ---------------------------------------------------------------- links: management
  /api/links/manage:
    get:
      operationId: resolveManagementLink
      tags: [links]
      summary: Resolve a management link (read-only).
      security: [{ linkToken: [] }]
      x-transaction: TX-X02
      x-requirements: [FR-SELF-1, FR-WL-7, FR-LNK-5, FR-LNK-6, FR-LNK-7, FR-LNK-9, FR-LNK-10, AC-60, AC-83, AC-126]
      x-principals: [link:management]
      x-idempotency: read-only
      x-confirmation-required: false
      responses:
        '200':
          description: Management view.
          headers: { Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }, Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagementView' }
        '404': { $ref: '#/components/responses/GenericInvalidLink' }
        '429': { $ref: '#/components/responses/GenericInvalidLinkRateLimited' }
        '500': { $ref: '#/components/responses/LinkInternalError' }
        '503': { $ref: '#/components/responses/LinkServiceUnavailable' }
    head:
      operationId: headManagementLink
      tags: [links]
      summary: HEAD of the management link resolution.
      security: [{ linkToken: [] }]
      x-transaction: TX-X02
      x-requirements: [FR-LNK-9, AC-60]
      x-principals: [link:management]
      x-idempotency: read-only
      x-confirmation-required: false
      responses:
        '200': { $ref: '#/components/responses/LinkHeadOk' }
        '404': { $ref: '#/components/responses/LinkHeadInvalid' }
        '429': { $ref: '#/components/responses/LinkHeadRateLimited' }
        '500': { $ref: '#/components/responses/LinkHeadError' }
        '503': { $ref: '#/components/responses/LinkHeadUnavailable' }

  /api/links/manage/cancel:
    post:
      operationId: cancelRegistration
      tags: [links]
      summary: Cancel the registration (explicit, confirmed action).
      security: [{ linkToken: [] }]
      x-transaction: TX-R03
      x-requirements: [FR-SELF-2, FR-SELF-3, FR-WL-2, BR-10, BR-23, FR-LNK-9, AC-8, AC-11, AC-58, AC-71, AC-127]
      x-principals: [link:management]
      x-idempotency: state
      x-confirmation-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmedAction' }
      responses:
        '200':
          description: The cancellation is confirmed in this response; the link stops working.
          headers: { Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }, Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationCancelled' }
        '400': { $ref: '#/components/responses/LinkBadRequest' }
        '403': { $ref: '#/components/responses/LinkForbidden' }
        '404': { $ref: '#/components/responses/GenericInvalidLink' }
        '409': { $ref: '#/components/responses/LinkConflict' }
        '422': { $ref: '#/components/responses/LinkValidationFailed' }
        '429': { $ref: '#/components/responses/GenericInvalidLinkRateLimited' }
        '500': { $ref: '#/components/responses/LinkInternalError' }
        '503': { $ref: '#/components/responses/LinkServiceUnavailable' }

  /api/links/manage/resend:
    post:
      operationId: requestTicketResend
      tags: [links]
      summary: Request a ticket email resend (idempotent by requestId).
      security: [{ linkToken: [] }]
      x-transaction: TX-P01
      x-requirements: [FR-SELF-4, FR-NTF-2c, FR-LNK-3, AC-113]
      x-principals: [link:management]
      x-idempotency: request-id
      x-confirmation-required: false
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResendRequest' }
      responses:
        '202':
          description: A resend is queued (a retry with the same requestId creates nothing new).
          headers: { Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }, Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResendQueued' }
        '400': { $ref: '#/components/responses/LinkBadRequest' }
        '403': { $ref: '#/components/responses/LinkForbidden' }
        '404': { $ref: '#/components/responses/GenericInvalidLink' }
        '409': { $ref: '#/components/responses/LinkConflict' }
        '422': { $ref: '#/components/responses/LinkValidationFailed' }
        '429': { $ref: '#/components/responses/LinkRateLimitedOrInvalid' }
        '500': { $ref: '#/components/responses/LinkInternalError' }
        '503': { $ref: '#/components/responses/LinkServiceUnavailable' }

  /api/links/manage/share-links:
    post:
      operationId: issueShareLink
      tags: [links]
      summary: Issue a new share link.
      security: [{ linkToken: [] }]
      x-transaction: TX-P02
      x-requirements: [FR-SHR-1, FR-LNK-2, FR-LNK-10, AC-175]
      x-principals: [link:management]
      x-idempotency: none
      x-confirmation-required: false
      responses:
        '201':
          description: The new share link (raw token only inside the URL fragment).
          headers: { Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }, Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareLinkIssued' }
        '403': { $ref: '#/components/responses/LinkForbidden' }
        '404': { $ref: '#/components/responses/GenericInvalidLink' }
        '409': { $ref: '#/components/responses/LinkConflict' }
        '429': { $ref: '#/components/responses/GenericInvalidLinkRateLimited' }
        '500': { $ref: '#/components/responses/LinkInternalError' }
        '503': { $ref: '#/components/responses/LinkServiceUnavailable' }

  /api/links/manage/rotations:
    post:
      operationId: rotateLink
      tags: [links]
      summary: Rotate the management or share link (confirmed; idempotent by requestId).
      security: [{ linkToken: [] }]
      x-transaction: TX-P03
      x-requirements: [FR-ROT-1, FR-ROT-2, FR-ROT-3, FR-ROT-5, FR-ROT-6, FR-ROT-8, FR-ROT-9, FR-ROT-11, BR-20, BR-28, AC-64, AC-65, AC-67, AC-68, AC-72, AC-75, AC-95]
      x-principals: [link:management]
      x-idempotency: request-id
      x-confirmation-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotationRequest' }
      responses:
        '200':
          description: Rotated (new link shown once), or "already replaced" (FR-ROT-11 a).
          headers: { Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }, Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RotationResult' }
        '400': { $ref: '#/components/responses/LinkBadRequest' }
        '403': { $ref: '#/components/responses/LinkForbidden' }
        '404': { $ref: '#/components/responses/GenericInvalidLink' }
        '409': { $ref: '#/components/responses/LinkConflict' }
        '422': { $ref: '#/components/responses/LinkValidationFailed' }
        '429': { $ref: '#/components/responses/LinkRateLimitedOrInvalid' }
        '500': { $ref: '#/components/responses/LinkInternalError' }
        '503': { $ref: '#/components/responses/LinkServiceUnavailable' }

  # ---------------------------------------------------------------- links: share
  /api/links/ticket:
    get:
      operationId: resolveShareLink
      tags: [links]
      summary: Share ticket view (read-only; never checks in).
      security: [{ linkToken: [] }]
      x-transaction: TX-X02
      x-requirements: [FR-SHR-2, FR-SHR-3, FR-SHR-4, FR-SHR-7, FR-SHR-8, FR-LNK-5, AC-45, AC-49, AC-54, AC-55, AC-56]
      x-principals: [link:share]
      x-idempotency: read-only
      x-confirmation-required: false
      responses:
        '200':
          description: One of the three share-view states.
          headers: { Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }, Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareView' }
        '404': { $ref: '#/components/responses/GenericInvalidLink' }
        '429': { $ref: '#/components/responses/GenericInvalidLinkRateLimited' }
        '500': { $ref: '#/components/responses/LinkInternalError' }
        '503': { $ref: '#/components/responses/LinkServiceUnavailable' }
    head:
      operationId: headShareLink
      tags: [links]
      summary: HEAD of the share view.
      security: [{ linkToken: [] }]
      x-transaction: TX-X02
      x-requirements: [FR-SHR-8, FR-LNK-9, AC-55, AC-60]
      x-principals: [link:share]
      x-idempotency: read-only
      x-confirmation-required: false
      responses:
        '200': { $ref: '#/components/responses/LinkHeadOk' }
        '404': { $ref: '#/components/responses/LinkHeadInvalid' }
        '429': { $ref: '#/components/responses/LinkHeadRateLimited' }
        '500': { $ref: '#/components/responses/LinkHeadError' }
        '503': { $ref: '#/components/responses/LinkHeadUnavailable' }

  # ---------------------------------------------------------------- links: staff invitation
  /api/links/invite:
    get:
      operationId: resolveStaffInvitation
      tags: [links]
      summary: Resolve a staff invitation (read-only).
      security: [{ linkToken: [] }]
      x-transaction: TX-X02
      x-requirements: [FR-STAFF-1, FR-STAFF-5, FR-LNK-9, AC-82, AC-101]
      x-principals: [link:staff_invitation]
      x-idempotency: read-only
      x-confirmation-required: false
      responses:
        '200':
          description: Invitation page data.
          headers: { Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }, Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationView' }
        '404': { $ref: '#/components/responses/GenericInvalidLink' }
        '429': { $ref: '#/components/responses/GenericInvalidLinkRateLimited' }
        '500': { $ref: '#/components/responses/LinkInternalError' }
        '503': { $ref: '#/components/responses/LinkServiceUnavailable' }
    head:
      operationId: headStaffInvitation
      tags: [links]
      summary: HEAD of the invitation resolution.
      security: [{ linkToken: [] }]
      x-transaction: TX-X02
      x-requirements: [FR-LNK-9, AC-60]
      x-principals: [link:staff_invitation]
      x-idempotency: read-only
      x-confirmation-required: false
      responses:
        '200': { $ref: '#/components/responses/LinkHeadOk' }
        '404': { $ref: '#/components/responses/LinkHeadInvalid' }
        '429': { $ref: '#/components/responses/LinkHeadRateLimited' }
        '500': { $ref: '#/components/responses/LinkHeadError' }
        '503': { $ref: '#/components/responses/LinkHeadUnavailable' }

  /api/links/invite/accept:
    post:
      operationId: acceptStaffInvitation
      tags: [links]
      summary: Accept a staff invitation; creates a staff session cookie.
      security: [{ linkToken: [] }]
      x-transaction: TX-S02
      x-requirements: [FR-STAFF-1, FR-STAFF-2, FR-STAFF-5, FR-STAFF-7, AC-82, AC-96, AC-101]
      x-principals: [link:staff_invitation]
      x-idempotency: state
      x-confirmation-required: false
      responses:
        '200':
          description: Accepted. The staff session cookie is set; the session ID is never in the body.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
            Set-Cookie: { $ref: '#/components/headers/SetStaffSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Redirect' }
        '403': { $ref: '#/components/responses/LinkForbidden' }
        '404': { $ref: '#/components/responses/GenericInvalidLink' }
        '429': { $ref: '#/components/responses/GenericInvalidLinkRateLimited' }
        '500': { $ref: '#/components/responses/LinkInternalError' }
        '503': { $ref: '#/components/responses/LinkServiceUnavailable' }

  # ---------------------------------------------------------------- links: sign-in
  /api/links/sign-in:
    get:
      operationId: resolveSignInLink
      tags: [links]
      summary: Resolve a sign-in link; issues the pre-session anti-forgery token (ADR-010).
      description: >-
        Read-only: no database write. Sets the short-lived __Host-ers_presession
        cookie and returns the matching preSessionToken, bound to this sign-in
        request (ADR-010 §4).
      security: [{ linkToken: [] }]
      x-transaction: TX-X02
      x-requirements: [FR-ORG-3, FR-LNK-9, AC-60, AC-147]
      x-principals: [link:sign_in]
      x-idempotency: read-only
      x-confirmation-required: false
      responses:
        '200':
          description: Masked address and the pre-session token.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
            Set-Cookie: { $ref: '#/components/headers/SetPreSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignInLinkView' }
        '404': { $ref: '#/components/responses/GenericInvalidLink' }
        '429': { $ref: '#/components/responses/GenericInvalidLinkRateLimited' }
        '500': { $ref: '#/components/responses/LinkInternalError' }
        '503': { $ref: '#/components/responses/LinkServiceUnavailable' }
    head:
      operationId: headSignInLink
      tags: [links]
      summary: HEAD of the sign-in link resolution (no cookie is set on HEAD).
      security: [{ linkToken: [] }]
      x-transaction: TX-X02
      x-requirements: [FR-LNK-9, AC-60, AC-147]
      x-principals: [link:sign_in]
      x-idempotency: read-only
      x-confirmation-required: false
      responses:
        '200': { $ref: '#/components/responses/LinkHeadOk' }
        '404': { $ref: '#/components/responses/LinkHeadInvalid' }
        '429': { $ref: '#/components/responses/LinkHeadRateLimited' }
        '500': { $ref: '#/components/responses/LinkHeadError' }
        '503': { $ref: '#/components/responses/LinkHeadUnavailable' }

  /api/links/sign-in/confirm:
    post:
      operationId: confirmSignIn
      tags: [links]
      summary: Confirm a sign-in; creates an organizer session cookie.
      security: [{ linkToken: [], preSessionCookie: [], csrfToken: [] }]
      x-transaction: TX-A02
      x-requirements: [FR-ORG-1, FR-ORG-3, FR-ORG-4, FR-ORG-5, NFR-CON-7, AC-147, AC-149, AC-182]
      x-principals: [link:sign_in]
      x-idempotency: state
      x-confirmation-required: false
      responses:
        '200':
          description: Signed in. The organizer session cookie is set and the pre-session cookie cleared.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
            Set-Cookie: { $ref: '#/components/headers/SetOrganizerSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Redirect' }
        '403': { $ref: '#/components/responses/LinkForbidden' }
        '404': { $ref: '#/components/responses/GenericInvalidLink' }
        '429': { $ref: '#/components/responses/GenericInvalidLinkRateLimited' }
        '500': { $ref: '#/components/responses/LinkInternalError' }
        '503': { $ref: '#/components/responses/LinkServiceUnavailable' }

  # ---------------------------------------------------------------- links: email change
  /api/links/email-change:
    get:
      operationId: resolveEmailChangeLink
      tags: [links]
      summary: Resolve an email-change confirmation link (read-only).
      security: [{ linkToken: [] }]
      x-transaction: TX-X02
      x-requirements: [FR-ORG-6, FR-LNK-9, AC-60, AC-150]
      x-principals: [link:email_change]
      x-idempotency: read-only
      x-confirmation-required: false
      responses:
        '200':
          description: Masked new address.
          headers: { Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }, Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailChangeLinkView' }
        '404': { $ref: '#/components/responses/GenericInvalidLink' }
        '429': { $ref: '#/components/responses/GenericInvalidLinkRateLimited' }
        '500': { $ref: '#/components/responses/LinkInternalError' }
        '503': { $ref: '#/components/responses/LinkServiceUnavailable' }
    head:
      operationId: headEmailChangeLink
      tags: [links]
      summary: HEAD of the email-change link resolution.
      security: [{ linkToken: [] }]
      x-transaction: TX-X02
      x-requirements: [FR-LNK-9, AC-60]
      x-principals: [link:email_change]
      x-idempotency: read-only
      x-confirmation-required: false
      responses:
        '200': { $ref: '#/components/responses/LinkHeadOk' }
        '404': { $ref: '#/components/responses/LinkHeadInvalid' }
